name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 1. जर gradlew फाईल android फोल्डरच्या आत असेल, तर इथे working-directory वापरा:
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./android   # <--- ही ओळ अत्यंत महत्त्वाची आहे

    - name: Build Debug APK with Gradle Wrapper
      run: ./gradlew assembleDebug
      working-directory: ./android   # <--- ही ओळ सुद्धा इथे वापरा
